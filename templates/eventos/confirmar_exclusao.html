{% extends 'base.html' %}
{% block title %}Excluir Evento{% endblock %}

{% block content %}
<div class="confirm-container">
  <div class="confirm-card">
    <div class="confirm-icon">⚠️</div>
    <h1 class="confirm-title">Confirmar Exclusão</h1>
    <p>Tem certeza que deseja excluir o evento <strong>"{{ evento.nome }}"</strong>?</p>
    <p class="text-muted">As tendas e placas alocadas serão marcadas como disponíveis novamente.</p>
    <div class="confirm-actions">
      <a href="{% url 'eventos:detalhe' evento.pk %}" class="btn btn-outline">Cancelar</a>
      <form method="post" style="display:inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sim, excluir</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
